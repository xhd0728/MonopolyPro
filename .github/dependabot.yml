version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
        update-types: [minor, patch]
      colyseus:
        patterns: ['@colyseus/*']
        update-types: [minor, patch]
      development:
        dependency-type: development
        exclude-patterns: ['@types/react', '@types/react-dom']
        update-types: [minor, patch]
      production:
        dependency-type: production
        exclude-patterns: [react, react-dom, '@colyseus/*']
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: ci
      include: scope
